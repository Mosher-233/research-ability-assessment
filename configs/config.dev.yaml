server:
  port: 8080
  mode: debug
  read_timeout: 10s
  write_timeout: 10s

database:
  type: mysql
  host: ${DB_HOST:-localhost}
  port: 3306
  user: ${DB_USER:-mysqluser}
  password: ${DB_PASSWORD:-mysqlpassword}
  dbname: ${DB_NAME:-research_assessment}
  sslmode: disable

llm:
  provider: deepseek
  api_key: ${DEEPSEEK_API_KEY}
  base_url: https://api.deepseek.com
  model: deepseek-chat
  max_tokens: 2048
  temperature: 0.7

redis:
  host: ${REDIS_HOST:-localhost}
  port: 6379
  password: ${REDIS_PASSWORD:-}
  db: 0

neo4j:
  uri: ${NEO4J_URI:-bolt://localhost:7687}
  username: ${NEO4J_USERNAME:-neo4j}
  password: ${NEO4J_PASSWORD:-password123}
