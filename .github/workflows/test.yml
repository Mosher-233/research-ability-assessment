name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  extractor-tests:
    name: Extractor Tests (DOCX + PDF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Run extractor tests
        run: go test -v -count=1 ./pkg/extractor/ -timeout 120s

      - name: Run extractor benchmarks
        run: go test -bench=. -benchtime=1x ./pkg/extractor/ -timeout 60s

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Run all tests (short mode)
        run: go test -short -count=1 $(go list ./... | grep -v /scripts) -timeout 120s

  llm-batch-test:
    name: LLM Batch Classification (sample)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Run LLM batch test (sample)
        if: env.DEEPSEEK_API_KEY != ''
        run: go run scripts/batch_llm_classify.go --sample 20 --workers 3 --config configs/config.dev.yaml
